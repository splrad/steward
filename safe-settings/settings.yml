repository:
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: false
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
additive_plugins:
  - labels
labels:
  - name: "auto/docs"
    color: "0075ca"
    description: "Documentation paths changed"
  - name: "auto/workflows"
    color: "0e8a16"
    description: "GitHub workflow paths changed"
  - name: "auto/tests"
    color: "5319e7"
    description: "Test paths changed"
  - name: "feature"
    color: "1d76db"
    description: "新增或扩展用户、开发者可观察能力。"
  - name: "bug"
    color: "d73a4a"
    description: "修复缺陷、回归或错误结果。"
  - name: "performance"
    color: "fbca04"
    description: "在行为基本不变时改进性能。"
  - name: "refactor"
    color: "a2eeef"
    description: "重组生产代码且保持外部行为不变。"
  - name: "test"
    color: "5319e7"
    description: "只修改测试、夹具或测试基础设施。"
  - name: "build"
    color: "fef2c0"
    description: "修改编译、依赖、打包或构建工具链。"
  - name: "documentation"
    color: "0075ca"
    description: "只修改面向人的文档。"
  - name: "workflow"
    color: "0e8a16"
    description: "只修改CI/CD和GitHub自动化编排。"
  - name: "chore"
    color: "ededed"
    description: "其他仓库维护、元数据或一般配置。"
  - name: "security"
    color: "d73a4a"
    description: "包含有事实依据的安全修复或加固。"
  - name: "breaking-change"
    color: "b60205"
    description: "包含需要迁移的不兼容变更。"
  - name: "area:source"
    color: "0052cc"
    description: "修改主要源代码。"
  - name: "area:test"
    color: "5319e7"
    description: "修改测试或测试夹具。"
  - name: "area:workflow"
    color: "0e8a16"
    description: "修改GitHub Actions工作流。"
  - name: "area:automation"
    color: "006b75"
    description: "修改仓库自动化。"
  - name: "area:docs"
    color: "0075ca"
    description: "修改文档。"
  - name: "area:config"
    color: "c5def5"
    description: "修改仓库配置。"
  - name: "area:runtime"
    color: "7057ff"
    description: "修改LayerScape运行时代码。"
  - name: "area:release"
    color: "f9d0c4"
    description: "修改版本或发布资产。"
  - name: "dependencies"
    color: "0366d6"
    description: "修改第三方依赖或锁文件。"
  - name: "github_actions"
    color: "000000"
    description: "修改GitHub Actions依赖或配置。"
  - name: "javascript"
    color: "f1e05a"
    description: "修改JavaScript或TypeScript生态依赖。"
  - name: "release:editing"
    color: "fbca04"
    description: "暂停候选文稿更新，确认当前 head 后可编辑。"
  - name: "release:abandoned"
    color: "fbca04"
    description: "维护者确认放弃当前发行周期。"
  - name: "release:supersede-required"
    color: "fbca04"
    description: "维护者要求受审修复版替代当前发行周期。"
