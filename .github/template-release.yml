tag-prefix: v
filter-by-commitish: true
template: |+
  ## 模板变更

  $CHANGES

change-template: '- $TITLE（[#$NUMBER]($URL)）'
categories:
  - type: pre-include
    when:
      paths:
        - copier.yml
        - templates/repository/**
        - .github/workflows/pr-title-reusable.yml
        - config/review/security-common.md
