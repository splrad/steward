name: Repository configuration event
on:
  workflow_dispatch:
    inputs:
      repository_id: {type: string, required: true}
      run_id: {type: string}
      attempt: {type: string}
      issue_number: {type: string}
      comment_id: {type: string}
permissions:
  contents: read
concurrency:
  group: steward-repository-configuration-${{ inputs.repository_id }}
  queue: max
  cancel-in-progress: false
jobs:
  promoted:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify execution commit was promoted
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ github.workflow_sha }}
        run: |
          promoted=$(gh api repos/splrad/steward/git/ref/heads/steward/validated-controller --jq .object.sha)
          test "$promoted" = "$EXECUTION_SHA"
  apply:
    needs: promoted
    if: github.repository_id == '1296724484' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: steward-automation
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.18
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install controller dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          uv sync --project tools/template --frozen --no-dev
      - name: Reconcile authorized configuration
        env:
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          REQUEST_RUN: ${{ inputs.run_id }}
          REQUEST_ATTEMPT: ${{ inputs.attempt }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
        run: node scripts/repository-configuration.mjs
