name: SPLRAD Steward / Sync Managed Labels
on:
  workflow_dispatch:
    inputs:
      repositoryId:
        required: false
        type: string
  workflow_run:
    workflows:
      - SPLRAD Steward / Deploy Runtime
    types:
      - completed
  schedule:
    - cron: 17 3 * * *
permissions:
  contents: read
  actions: read
concurrency:
  group: workflow-policy:${{ github.workflow_ref }}:steward-managed-labels-sync
  cancel-in-progress: false
jobs:
  synchronize:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == github.event.repository.default_branch && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: steward-automation
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: policy-bootstrap
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: policy-bootstrap/.node-version
      - id: policy
        name: 解析已部署规则提交
        run: node policy-bootstrap/packages/runner/dist/index.js trusted-policy-source
        env:
          POLICY_SOURCE_READ_TOKEN: ${{ github.token }}
          POLICY_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.policy.outputs.policy_sha }}
          persist-credentials: false
          path: policy-live
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: policy-live/.node-version
      - run: npm ci --ignore-scripts
        working-directory: policy-live
      - name: 同步受管标签定义
        env:
          APP_ID: "4243096"
          INSTALLATION_ID: "145952003"
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          REPOSITORY_ID: ${{ inputs.repositoryId }}
          POLICY_SHA: ${{ steps.policy.outputs.policy_sha }}
          SYNC_TRIGGER: ${{ github.event_name }}
          TRIGGER_ACTOR_ID: ${{ github.actor_id }}
          TRIGGER_ACTOR_LOGIN: ${{ github.actor }}
        run: |
          repository_arguments=()
          if [[ -n "$REPOSITORY_ID" ]]; then
            repository_arguments+=(--repository-id "$REPOSITORY_ID")
          fi
          node packages/runner/dist/index.js sync-managed-labels "${repository_arguments[@]}" --policy-sha "$POLICY_SHA"
        working-directory: policy-live
