name: SPLRAD Steward / Release
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Registered repository; empty selects all enabled repositories
        type: string
        required: false
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  targets:
    if: github.repository == 'splrad/steward' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.18
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          arguments=()
          if [[ -n "$REPOSITORY" ]]; then arguments+=(--repository "$REPOSITORY"); fi
          node packages/runner/dist/index.js release-plan targets "${arguments[@]}" --output targets.json
  plan:
    needs: targets
    if: needs.targets.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: steward-release
      deployment: false
    concurrency:
      group: release-plan-${{ matrix.repositoryId }}
      cancel-in-progress: false
      queue: max
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.18
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - id: before
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ matrix.repositoryId }}
          POLICY_SHA: ${{ github.workflow_sha }}
        run: node packages/runner/dist/index.js release-plan inspect --repository-id "$REPOSITORY_ID" --policy-sha "$POLICY_SHA" --phase before --output before.json
      - id: target-token
        if: steps.before.outputs.needs_write == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '4243096'
          private-key: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          owner: splrad
          repositories: ${{ matrix.repository }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: write
      - id: write-check
        if: steps.target-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ matrix.repositoryId }}
          POLICY_SHA: ${{ github.workflow_sha }}
        run: node packages/runner/dist/index.js release-plan inspect --repository-id "$REPOSITORY_ID" --policy-sha "$POLICY_SHA" --phase before --output write-check.json
      - id: release
        if: steps.write-check.outputs.should_run_release == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.target-token.outputs.token }}
          repo-url: ${{ matrix.fullName }}
          target-branch: ${{ matrix.defaultBranch }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - id: after
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ matrix.repositoryId }}
          POLICY_SHA: ${{ github.workflow_sha }}
        run: node packages/runner/dist/index.js release-plan inspect --repository-id "$REPOSITORY_ID" --policy-sha "$POLICY_SHA" --phase after --output after.json
      - id: prepare
        if: steps.after.outputs.should_run_pr == 'true' && steps.target-token.outputs.token != ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.target-token.outputs.token }}
          repo-url: ${{ matrix.fullName }}
          target-branch: ${{ matrix.defaultBranch }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      - id: dispatch
        if: steps.target-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          POLICY_READ_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ matrix.repositoryId }}
          POLICY_SHA: ${{ github.workflow_sha }}
        run: |
          while IFS=$'\t' read -r unit release_id release_pr; do
            node packages/runner/dist/index.js release-plan dispatch --repository-id "$REPOSITORY_ID" --unit "$unit" --release-id "$release_id" --release-pr "$release_pr" --policy-sha "$POLICY_SHA"
          done < <(jq -r '.units[] | select(.releaseId != null) | [.unitId, .releaseId, .releasePr] | @tsv' after.json)
