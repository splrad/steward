name: SPLRAD Steward / Release

on:
  workflow_dispatch:
    inputs:
      repositoryId: { required: true, type: string }
      pullRequestNumber: { required: true, type: string }
      targetSha: { required: true, type: string }

permissions:
  contents: read
concurrency:
  group: steward-release-${{ inputs.repositoryId }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: steward-release
    outputs:
      shouldRelease: ${{ steps.plan.outputs.shouldRelease }}
      displayVersion: ${{ steps.plan.outputs.displayVersion }}
      buildId: ${{ steps.plan.outputs.buildId }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: splrad/LayerScape, ref: "${{ inputs.targetSha }}", path: target, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: "${{ github.sha }}", path: steward-policy, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: steward-policy/.node-version, cache: npm, cache-dependency-path: steward-policy/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: steward-policy
      - name: 重新读取并规划发布
        id: plan
        env:
          APP_ID: "4243096"
          INSTALLATION_ID: "145952003"
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          TRIGGER_ACTOR_ID: ${{ github.actor_id }}
          TRIGGER_ACTOR_LOGIN: ${{ github.actor }}
        run: node steward-policy/packages/runner/dist/index.js release-preflight --workspace target --repository-id "${{ inputs.repositoryId }}" --pull-request-number "${{ inputs.pullRequestNumber }}" --target-sha "${{ inputs.targetSha }}" --policy-sha "${{ github.sha }}" --trigger "${{ github.actor_id == '301115370' && 'app' || 'manual' }}" --manifest "${{ runner.temp }}/release-manifest.json"

  build:
    needs: preflight
    if: ${{ needs.preflight.outputs.shouldRelease == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: splrad/LayerScape, ref: "${{ inputs.targetSha }}", path: target, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: "${{ github.sha }}", path: steward-policy, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: steward-policy/.node-version, cache: npm, cache-dependency-path: steward-policy/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: steward-policy
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with: { global-json-file: target/global.json }
      - name: 构建三项发布资产
        shell: pwsh
        working-directory: target
        run: pwsh -NoProfile -NonInteractive -File ./tools/Publish-ReleaseAssets.ps1
      - name: 生成发布清单
        run: node steward-policy/packages/runner/dist/index.js release-preflight --workspace target --repository-id "${{ inputs.repositoryId }}" --target-sha "${{ inputs.targetSha }}" --policy-sha "${{ github.sha }}" --manifest "target/artifacts/ReleaseAssets/release-manifest.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: "layerscape-release-${{ inputs.targetSha }}", path: "target/artifacts/ReleaseAssets", retention-days: 1, if-no-files-found: error, compression-level: 0 }

  notes:
    needs: preflight
    if: ${{ needs.preflight.outputs.shouldRelease == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: steward-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci --ignore-scripts
      - name: 生成确定性发布说明
        env:
          APP_ID: "4243096"
          INSTALLATION_ID: "145952003"
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
        run: node packages/runner/dist/index.js release-notes --repository-id "${{ inputs.repositoryId }}" --pull-request-number "${{ inputs.pullRequestNumber }}" --target-sha "${{ inputs.targetSha }}" --policy-sha "${{ github.sha }}" --display-version "${{ needs.preflight.outputs.displayVersion }}" --output release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: "layerscape-notes-${{ inputs.targetSha }}", path: release-notes.md, retention-days: 1, if-no-files-found: error }

  publish:
    needs: [build, notes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: steward-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: { name: "layerscape-release-${{ inputs.targetSha }}", path: release }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: { name: "layerscape-notes-${{ inputs.targetSha }}", path: release-notes }
      - name: 发布或继续唯一匹配草稿
        env:
          APP_ID: "4243096"
          INSTALLATION_ID: "145952003"
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
        run: node packages/runner/dist/index.js release-publish --manifest release/release-manifest.json --notes release-notes/release-notes.md --repository splrad/LayerScape

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: steward-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: { name: "layerscape-release-${{ inputs.targetSha }}", path: release }
      - name: 复核远程不可变发布
        env:
          APP_ID: "4243096"
          INSTALLATION_ID: "145952003"
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
        run: node packages/runner/dist/index.js release-verify --manifest release/release-manifest.json --repository splrad/LayerScape
