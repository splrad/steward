name: SPLRAD Steward / Release
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: steward-release-coordinator
  cancel-in-progress: false
jobs:
  release-coordinator:
    if: github.repository == 'splrad/steward' && github.repository_id == '1296724484' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      copilot-requests: write
    environment:
      name: steward-release
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.18
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install locked release libraries
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/quality-language --ignore-scripts --no-audit --no-fund
          uv sync --project tools/template --frozen --only-group release-inspection --no-build
      - name: business-release-coordinator
        shell: bash
        env:
          STEWARD_CENTRAL_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
          STEWARD_COPILOT_TOKEN: ${{ github.token }}
        run: node scripts/release-coordinator.mjs

  automation-health:
    if: github.repository == 'splrad/steward' && github.repository_id == '1296724484' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write
    concurrency:
      group: steward-automation-health
      cancel-in-progress: false
    steps:
      - name: automation-health-native
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
          HEALTH_ISSUE: ${{ vars.STEWARD_HEALTH_ISSUE }}
          EXPECTED_PAUSED_RELEASE: ${{ vars.STEWARD_EXPECTED_PAUSED_RELEASE }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          api() { gh api --method GET -H 'X-GitHub-Api-Version: 2026-03-10' "$1" 2>/dev/null; }
          [[ "$HEALTH_ISSUE" =~ ^[1-9][0-9]*$ ]]
          repo=$(api repos/splrad/steward)
          jq -e --arg branch "$DEFAULT_BRANCH" '.id==1296724484 and .full_name=="splrad/steward" and .default_branch==$branch and .archived==false and .disabled==false' <<<"$repo" >/dev/null
          current=$(api "repos/splrad/steward/actions/runs/$CURRENT_RUN_ID")
          jq -e --argjson id "$CURRENT_RUN_ID" --argjson attempt "$CURRENT_ATTEMPT" --arg branch "$DEFAULT_BRANCH" '.id==$id and .run_attempt==$attempt and .repository.id==1296724484 and .head_repository.id==1296724484 and .head_branch==$branch and (.path==".github/workflows/release.yml" or .path==".github/workflows/sync-managed.yml") and (.event=="schedule" or .event=="workflow_dispatch" or .event=="push")' <<<"$current" >/dev/null
          issue=$(api "repos/splrad/steward/issues/$HEALTH_ISSUE")
          jq -e --argjson number "$HEALTH_ISSUE" '.number==$number and .pull_request==null' <<<"$issue" >/dev/null
          bot=$(api 'users/github-actions%5Bbot%5D' | jq -er 'select(.type=="Bot")|.id')
          marker='<!-- splrad-automation-health:v2 -->'
          read_codes() {
            gh api --method GET --paginate --slurp -H 'X-GitHub-Api-Version: 2026-03-10' "repos/splrad/steward/issues/$HEALTH_ISSUE/comments?per_page=100" 2>/dev/null |
              jq -ce --arg marker "$marker" --argjson bot "$bot" 'if all(.[];type=="array") then add else error("comments unavailable") end | [.[]|select(.user.id==$bot and (.body//""|startswith($marker+"\n")))] | sort_by(.id)|last | if .==null then [] else .body|split("\n")[1]|fromjson end | if type=="array" and all(.[];type=="string" and test("^(release\\.yml|sync-managed\\.yml):(WORKFLOW_UNAVAILABLE|WORKFLOW_DISABLED|WORKFLOW_PAUSED|ENABLE_UNCONFIRMED|RUN_UNAVAILABLE|WAKE_UNKNOWN|ENTRY_OVERDUE)$")) then sort|unique else error("health state unavailable") end'
          }
          previous=$(read_codes)
          codes='[]'
          record() { codes=$(jq -cn --argjson codes "$codes" --arg code "$file:$1" '$codes+[$code]'); }
          record_disabled() {
            if [[ "$file" == release.yml && "$workflow_id" == 311600220 && "$state" == disabled_manually && "${EXPECTED_PAUSED_RELEASE:-}" == 311600220 ]]; then
              record WORKFLOW_PAUSED
            else
              record WORKFLOW_DISABLED
            fi
          }
          latest_run() {
            gh run list --repo splrad/steward --workflow "$file" --branch "$DEFAULT_BRANCH" --limit 1 --json databaseId,createdAt,status,conclusion 2>/dev/null |
              jq -ce 'if type=="array" and length<=1 and all(.[]; (.databaseId|type)=="number" and .databaseId>0 and (.databaseId|floor)==.databaseId and (.createdAt|type)=="string" and (.status=="completed" or .status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested")) then . else error("recent Run unavailable") end'
          }
          workflow_matches() {
            jq -e --arg path ".github/workflows/$file" --argjson id "$workflow_id" '.id==$id and .path==$path' <<<"$1" >/dev/null
          }
          for file in release.yml sync-managed.yml; do
            if ! workflow=$(api "repos/splrad/steward/actions/workflows/$file") ||
               ! workflow_id=$(jq -er --arg path ".github/workflows/$file" 'select(.path==$path and (.id|type)=="number" and .id>0 and (.id|floor)==.id)|.id' <<<"$workflow"); then
              record WORKFLOW_UNAVAILABLE; continue
            fi
            state=$(jq -r '.state' <<<"$workflow")
            if [[ "$state" == disabled_inactivity ]]; then
              # Recheck the current state immediately before the only enable request.
              if ! workflow=$(api "repos/splrad/steward/actions/workflows/$workflow_id") || ! workflow_matches "$workflow"; then record WORKFLOW_UNAVAILABLE; continue; fi
              state=$(jq -r '.state' <<<"$workflow")
              if [[ "$state" == disabled_inactivity ]]; then
                gh api --method PUT -H 'X-GitHub-Api-Version: 2026-03-10' "repos/splrad/steward/actions/workflows/$workflow_id/enable" >/dev/null 2>&1 || true
                if ! workflow=$(api "repos/splrad/steward/actions/workflows/$workflow_id") || ! workflow_matches "$workflow"; then record ENABLE_UNCONFIRMED; continue; fi
                state=$(jq -r '.state' <<<"$workflow")
                if [[ "$state" == disabled_inactivity ]]; then record ENABLE_UNCONFIRMED; continue; fi
              fi
            fi
            if [[ "$state" != active ]]; then record_disabled; continue; fi
            if ! runs=$(latest_run); then record RUN_UNAVAILABLE; continue; fi
            created=$(jq -r '.[0].createdAt//"1970-01-01T00:00:00Z"' <<<"$runs")
            if ! created_epoch=$(date -u -d "$created" +%s); then record RUN_UNAVAILABLE; continue; fi
            now=$(date -u +%s)
            if ((created_epoch>now)); then record RUN_UNAVAILABLE; continue; fi
            if ((now-created_epoch<=2*3600)); then continue; fi
            # A recent Run does not prove that older Runs have finished. Native concurrency
            # serializes this observation wake; business writes reconcile their native outcomes.
            if ! workflow=$(api "repos/splrad/steward/actions/workflows/$workflow_id") || ! workflow_matches "$workflow"; then record WORKFLOW_UNAVAILABLE; continue; fi
            state=$(jq -r '.state' <<<"$workflow")
            if [[ "$state" != active ]]; then record_disabled; continue; fi
            response_known=true
            gh workflow run "$file" --repo splrad/steward --ref "$DEFAULT_BRANCH" >/dev/null 2>&1 || response_known=false
            # Read once after the write, including a lost response. Retry only on a later
            # fixed wake after it has read native state again.
            if ! observed=$(latest_run); then record WAKE_UNKNOWN; continue; fi
            observed_created=$(jq -r '.[0].createdAt//"1970-01-01T00:00:00Z"' <<<"$observed")
            if ! observed_epoch=$(date -u -d "$observed_created" +%s); then record WAKE_UNKNOWN; continue; fi
            if ((observed_epoch>=now && observed_epoch<=$(date -u +%s))); then continue; fi
            if [[ "$response_known" == true ]]; then record ENTRY_OVERDUE; else record WAKE_UNKNOWN; fi
          done
          codes=$(jq -c 'sort|unique' <<<"$codes")
          if [[ "$codes" != "$previous" ]]; then
            body=$(printf '%s\n%s\n\n中央入口观察：%s\nhttps://github.com/splrad/steward/actions/runs/%s\n' "$marker" "$codes" "$codes" "$CURRENT_RUN_ID")
            payload=$(jq -cn --arg body "$body" '{body:$body}')
            gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' "repos/splrad/steward/issues/$HEALTH_ISSUE/comments" --input - <<<"$payload" >/dev/null 2>&1 || true
            [[ "$(read_codes)" == "$codes" ]]
          fi
          # Expected maintenance remains visible and never enables or dispatches Release.
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '入口观察：%s\n\nWORKFLOW_PAUSED 表示已批准的 Release 人工暂停，不代表发行验收通过。\n' "$codes" >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -e 'all(.[]; .=="release.yml:WORKFLOW_PAUSED")' <<<"$codes" >/dev/null
