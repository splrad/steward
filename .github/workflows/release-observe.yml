name: SPLRAD bounded candidate observation
run-name: Observe candidate ${{ inputs.request_key }}
on:
  workflow_dispatch:
    inputs:
      identity_json:
        type: string
        required: true
      request_key:
        type: string
        required: true
      policy_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: steward-release-coordinator
  cancel-in-progress: false
  queue: max
jobs:
  observe:
    if: github.repository_id == '1296724484' && github.ref == 'refs/heads/main' && inputs.policy_sha == github.sha && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: steward-release
      deployment: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.18
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install locked controller dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fixed bounded entry
        env:
          STEWARD_CENTRAL_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
          BOUNDED_MODE: observe
          BOUNDED_IDENTITY_JSON: ${{ inputs.identity_json }}
          BOUNDED_REQUEST_KEY: ${{ inputs.request_key }}
          BOUNDED_POLICY_SHA: ${{ inputs.policy_sha }}
        run: node scripts/bounded-release-entry.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-observation-${{ inputs.request_key }}
          path: result.json
          if-no-files-found: error
          retention-days: 90
