name: SPLRAD PR title policy
on:
  workflow_call:
permissions:
  pull-requests: read
jobs:
  title:
    name: Validate title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            build
            deps
            chore
            ci
            refactor
            test
            style
          requireScope: 'false'
          validateSingleCommit: 'false'
          wip: 'false'
