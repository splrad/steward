name: SPLRAD PR title policy
on:
  workflow_call:
permissions:
  pull-requests: read
jobs:
  title:
    name: Validate title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Conventional Commits title
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            build
            deps
            chore
            ci
            refactor
            test
            style
          requireScope: 'false'
          validateSingleCommit: 'false'
          wip: 'false'
