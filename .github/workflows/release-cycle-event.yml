name: SPLRAD release cycle event
run-name: Release cycle ${{ inputs.request_key }}
on:
  workflow_dispatch:
    inputs:
      event_json:
        type: string
        required: true
      request_key:
        type: string
        required: true
      policy_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: steward-release-coordinator
  cancel-in-progress: false
  queue: max
jobs:
  release-coordinator:
    if: github.actor_id == '301115370' && github.repository_id == '1296724484' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.policy_sha == github.sha && github.workflow_sha == github.sha
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment:
      name: steward-release
      deployment: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.11.14
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install locked controller dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          uv sync --project tools/template --frozen --only-group release-inspection --no-build
      - name: Select the original product Run, attempt and artifact
        if: ${{ fromJSON(inputs.event_json).kind == 'run' && vars.STEWARD_OFFICIAL_RELEASE == 'true' }}
        id: official_delivery
        env:
          STEWARD_CENTRAL_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
          BOUNDED_MODE: cycle
          BOUNDED_POLICY_SHA: ${{ inputs.policy_sha }}
          BOUNDED_EVENT_JSON: ${{ inputs.event_json }}
          BOUNDED_REQUEST_KEY: ${{ inputs.request_key }}
          OFFICIAL_RELEASE_ENABLED: ${{ vars.STEWARD_OFFICIAL_RELEASE }}
          OFFICIAL_RELEASE_PHASE: select
        run: node scripts/release-cycle-event.mjs
      - name: Issue the product Actions read token
        if: ${{ steps.official_delivery.outputs.selected == 'true' }}
        id: delivery_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: Iv23liuSr0qd4WLJdZhH
          private-key: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          owner: ${{ steps.official_delivery.outputs.owner }}
          repositories: ${{ steps.official_delivery.outputs.repo }}
          permission-actions: read
      - name: Download the exact product archive
        if: ${{ steps.official_delivery.outputs.selected == 'true' }}
        id: delivery_archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          repository: ${{ steps.official_delivery.outputs.repository }}
          run-id: ${{ steps.official_delivery.outputs.run_id }}
          artifact-ids: ${{ steps.official_delivery.outputs.artifact_id }}
          github-token: ${{ steps.delivery_token.outputs.token }}
          path: ${{ runner.temp }}/official-product-archive
          skip-decompress: true
          digest-mismatch: error
      - name: Check the original product archive and freeze its delivery
        if: ${{ steps.delivery_archive.outcome == 'success' }}
        id: official_plan
        env:
          STEWARD_CENTRAL_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
          BOUNDED_MODE: cycle
          BOUNDED_POLICY_SHA: ${{ inputs.policy_sha }}
          BOUNDED_EVENT_JSON: ${{ inputs.event_json }}
          BOUNDED_REQUEST_KEY: ${{ inputs.request_key }}
          OFFICIAL_RELEASE_ENABLED: ${{ vars.STEWARD_OFFICIAL_RELEASE }}
          OFFICIAL_RELEASE_PHASE: prepare
          OFFICIAL_RELEASE_ARCHIVE_DIR: ${{ steps.delivery_archive.outputs.download-path }}
        run: node scripts/release-cycle-event.mjs
      - name: Issue the product release installation token
        if: ${{ steps.official_plan.outputs.ready == 'true' }}
        id: official_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: Iv23liuSr0qd4WLJdZhH
          private-key: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          owner: ${{ steps.official_plan.outputs.owner }}
          repositories: ${{ steps.official_plan.outputs.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Check the official branch-wide release scope
        if: ${{ steps.official_plan.outputs.ready == 'true' }}
        id: official_preflight
        env:
          OFFICIAL_RELEASE_TOKEN: ${{ steps.official_token.outputs.token }}
        run: node scripts/official-release.mjs
      - name: Create the official tag and draft
        if: ${{ steps.official_preflight.outputs.create == 'true' }}
        id: official_draft
        # GitHub object readback decides whether a partial Action can be resumed.
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          repo-url: ${{ steps.official_plan.outputs.owner }}/${{ steps.official_plan.outputs.repo }}
          target-branch: ${{ steps.official_plan.outputs.target_branch }}
          token: ${{ steps.official_token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - name: business-release-coordinator
        env:
          STEWARD_CENTRAL_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
          BOUNDED_MODE: cycle
          BOUNDED_POLICY_SHA: ${{ inputs.policy_sha }}
          BOUNDED_EVENT_JSON: ${{ inputs.event_json }}
          BOUNDED_REQUEST_KEY: ${{ inputs.request_key }}
          OFFICIAL_RELEASE_ENABLED: ${{ vars.STEWARD_OFFICIAL_RELEASE }}
          OFFICIAL_RELEASE_TOKEN: ${{ steps.official_token.outputs.token }}
          OFFICIAL_RELEASE_ACTION_ID: ${{ steps.official_draft.outputs.id }}
          OFFICIAL_RELEASE_ACTION_TAG: ${{ steps.official_draft.outputs.tag_name }}
          OFFICIAL_RELEASE_ACTION_SHA: ${{ steps.official_draft.outputs.sha }}
          OFFICIAL_RELEASE_ARCHIVE_DIR: ${{ steps.delivery_archive.outputs.download-path }}
        run: node scripts/release-cycle-event.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-cycle-${{ inputs.request_key }}-${{ github.run_attempt }}
          path: result.json
          if-no-files-found: error
          retention-days: 90
