name: SPLRAD Pages maintenance event
run-name: Pages completion ${{ inputs.repository_id }} ${{ inputs.run_id }} ${{ inputs.attempt }}
on:
  workflow_dispatch:
    inputs:
      repository_id:
        type: string
        required: true
      workflow_id:
        type: string
        required: true
      run_id:
        type: string
        required: true
      attempt:
        type: string
        required: true
      policy_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: steward-pages-maintenance-${{ inputs.repository_id }}-${{ inputs.run_id }}-${{ inputs.attempt }}
  cancel-in-progress: false
jobs:
  event:
    if: github.actor_id == '301115370' && github.run_attempt == 1 && github.repository_id == '1296724484' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.policy_sha == github.sha && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: steward-release
      deployment: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.11.14
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install locked controller dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          uv sync --project tools/template --frozen --only-group release-inspection --no-build
      - name: Recover the original product Pages Run
        env:
          STEWARD_CENTRAL_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
          BOUNDED_MODE: pages
          PAGES_POLICY_SHA: ${{ inputs.policy_sha }}
          PAGES_REPOSITORY_ID: ${{ inputs.repository_id }}
          PAGES_WORKFLOW_ID: ${{ inputs.workflow_id }}
          PAGES_RUN_ID: ${{ inputs.run_id }}
          PAGES_ATTEMPT: ${{ inputs.attempt }}
        run: node scripts/pages-completion-entry.mjs
