name: SPLRAD Steward / Quality Chinese Summary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quality-language-summary.yml'
      - 'config/review/quality-language.json'
      - 'packages/**'
      - 'schema/quality-language-output.schema.json'
      - 'scripts/quality-language-summary.mjs'
      - 'scripts/release-record.mjs'
      - 'tools/quality-language/**'
      - 'package*.json'
      - 'mise.*'
  schedule:
    - cron: '8-58/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: steward-quality-language
  cancel-in-progress: false
jobs:
  quality-summary:
    if: github.repository == 'splrad/steward' && github.repository_id == '1296724484' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.STEWARD_QUALITY_LANGUAGE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    environment:
      name: steward-release-notes
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.18
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install locked libraries without credentials
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/quality-language --ignore-scripts --no-audit --no-fund
          npm run verify:runtime --prefix tools/quality-language
      - name: Read and summarize native quality findings
        env:
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_COPILOT_TOKEN: ${{ github.token }}
          STEWARD_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: node scripts/quality-language-summary.mjs
