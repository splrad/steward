name: SPLRAD Steward / Quality Chinese Summary
on:
  workflow_dispatch:
    inputs:
      repository_id:
        required: true
        type: string
      pull_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      policy_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: steward-quality-language
  queue: max
  cancel-in-progress: false
jobs:
  quality-summary:
    if: github.repository == 'splrad/steward' && github.repository_id == '1296724484' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor_id == '301115370' && github.sha == inputs.policy_sha && github.workflow_sha == github.sha && vars.STEWARD_QUALITY_LANGUAGE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    environment:
      name: steward-release-notes
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.11.14
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install locked libraries without credentials
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/quality-language --ignore-scripts --no-audit --no-fund
          npm run verify:runtime --prefix tools/quality-language
      - name: Read and summarize native quality findings
        env:
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_COPILOT_TOKEN: ${{ github.token }}
          STEWARD_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: node scripts/quality-language-summary.mjs
