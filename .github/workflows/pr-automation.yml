name: SPLRAD Steward / PR Automation

on:
  workflow_dispatch:
    inputs:
      deliveryId: { required: true, type: string }
      repositoryId: { required: true, type: string }
      sourceRef: { required: true, type: string }
      eventAfterSha: { required: true, type: string }
      sourceActorId: { required: true, type: string }
      sourceActorLogin: { required: true, type: string }
      policySha: { required: true, type: string }

permissions:
  contents: read
concurrency:
  group: steward-pr-automation-${{ inputs.repositoryId }}-${{ inputs.sourceRef }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: steward-automation
      deployment: false
    steps:
      - name: 检出中央规则
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: "${{ inputs.policySha }}", persist-credentials: false }
      - name: 准备Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .node-version, cache: npm }
      - name: 安装依赖
        run: npm ci --ignore-scripts
      - name: 生成Copilot输入
        env:
          APP_ID: "4243096"
          INSTALLATION_ID: "145952003"
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          COPILOT_OUTPUT_PATH: ${{ runner.temp }}/copilot-output.jsonl
          PR_COPILOT_PROMPT_PATH: ${{ runner.temp }}/copilot-prompt.txt
          PR_PREPARED_FACTS_PATH: ${{ runner.temp }}/pr-prepared-facts.json
          PREPARE_ONLY: "true"
        run: node packages/runner/dist/index.js pr-automation --delivery-id "${{ inputs.deliveryId }}" --repository-id "${{ inputs.repositoryId }}" --source-ref "${{ inputs.sourceRef }}" --event-after-sha "${{ inputs.eventAfterSha }}" --source-actor-id "${{ inputs.sourceActorId }}" --source-actor-login "${{ inputs.sourceActorLogin }}" --policy-sha "${{ inputs.policySha }}"
      - name: 使用Copilot润色
        id: copilot
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
          PR_COPILOT_PROMPT_PATH: ${{ runner.temp }}/copilot-prompt.txt
        run: npx --no-install copilot -p "$(cat "$PR_COPILOT_PROMPT_PATH")" --available-tools= --no-auto-update --output-format json --stream off --no-color --no-custom-instructions --disable-builtin-mcps --no-ask-user > "${{ runner.temp }}/copilot-output.jsonl"
      - name: 判断Copilot输出是否需要修复
        id: repair_plan
        if: steps.copilot.outcome == 'success'
        continue-on-error: true
        env:
          APP_ID: "4243096"
          INSTALLATION_ID: "145952003"
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          COPILOT_OUTPUT_PATH: ${{ runner.temp }}/copilot-output.jsonl
          PR_COPILOT_REPAIR_PROMPT_PATH: ${{ runner.temp }}/copilot-repair-prompt.txt
          PR_PREPARED_FACTS_PATH: ${{ runner.temp }}/pr-prepared-facts.json
          PREPARE_REPAIR_ONLY: "true"
        run: node packages/runner/dist/index.js pr-automation --delivery-id "${{ inputs.deliveryId }}" --repository-id "${{ inputs.repositoryId }}" --source-ref "${{ inputs.sourceRef }}" --event-after-sha "${{ inputs.eventAfterSha }}" --source-actor-id "${{ inputs.sourceActorId }}" --source-actor-login "${{ inputs.sourceActorLogin }}" --policy-sha "${{ inputs.policySha }}"
      - name: 修复Copilot业务JSON
        id: copilot_repair
        if: steps.repair_plan.outputs.repair-required == 'true'
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
          PR_COPILOT_REPAIR_PROMPT_PATH: ${{ runner.temp }}/copilot-repair-prompt.txt
        run: npx --no-install copilot -p "$(cat "$PR_COPILOT_REPAIR_PROMPT_PATH")" --available-tools= --no-auto-update --output-format json --stream off --no-color --no-custom-instructions --disable-builtin-mcps --no-ask-user > "${{ runner.temp }}/copilot-repair-output.jsonl"
      - name: 收敛拉取请求
        id: reconcile
        env:
          APP_ID: "4243096"
          INSTALLATION_ID: "145952003"
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          COPILOT_OUTPUT_PATH: ${{ runner.temp }}/copilot-output.jsonl
          COPILOT_REPAIR_OUTPUT_PATH: ${{ runner.temp }}/copilot-repair-output.jsonl
          PR_PREPARED_FACTS_PATH: ${{ runner.temp }}/pr-prepared-facts.json
          COPILOT_STEP_OUTCOME: ${{ steps.copilot.outcome }}
          COPILOT_REPAIR_STEP_OUTCOME: ${{ steps.copilot_repair.outcome }}
          COPILOT_REVIEW_REQUEST_TOKEN: ${{ secrets.COPILOT_REVIEW_REQUEST_TOKEN }}
        run: node packages/runner/dist/index.js pr-automation --delivery-id "${{ inputs.deliveryId }}" --repository-id "${{ inputs.repositoryId }}" --source-ref "${{ inputs.sourceRef }}" --event-after-sha "${{ inputs.eventAfterSha }}" --source-actor-id "${{ inputs.sourceActorId }}" --source-actor-login "${{ inputs.sourceActorLogin }}" --policy-sha "${{ inputs.policySha }}"
      - name: 删除临时人工智能输入
        if: always()
        run: rm -f "${{ runner.temp }}/copilot-prompt.txt" "${{ runner.temp }}/copilot-output.jsonl" "${{ runner.temp }}/copilot-repair-prompt.txt" "${{ runner.temp }}/copilot-repair-output.jsonl" "${{ runner.temp }}/pr-prepared-facts.json"
