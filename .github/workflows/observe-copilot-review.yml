name: SPLRAD Steward / Observe Copilot Review

on:
  workflow_dispatch:
    inputs:
      repositoryId: { description: 目标仓库编号, required: true, type: string }
      pullRequestNumber: { description: PR编号, required: true, type: string }
      headSha: { description: 待核对的当前PR提交, required: true, type: string }

permissions:
  contents: read
concurrency:
  group: steward-copilot-observe-${{ inputs.repositoryId }}-${{ inputs.pullRequestNumber }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'splrad/steward' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: steward-automation
      deployment: false
    outputs:
      state: ${{ steps.observe.outputs.state }}
      reason: ${{ steps.observe.outputs.reason }}
      headSha: ${{ steps.observe.outputs.headSha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: "${{ github.workflow_sha }}", persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci --ignore-scripts
      - name: 读取当前Copilot审查证据
        id: observe
        shell: bash
        env:
          APP_ID: "4243096"
          INSTALLATION_ID: "145952003"
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          REPOSITORY_ID: ${{ inputs.repositoryId }}
          PULL_REQUEST_NUMBER: ${{ inputs.pullRequestNumber }}
          HEAD_SHA: ${{ inputs.headSha }}
          POLICY_SHA: ${{ github.workflow_sha }}
        run: |
          node packages/runner/dist/index.js observe-copilot-review \
            --repository-id "$REPOSITORY_ID" \
            --pull-request-number "$PULL_REQUEST_NUMBER" \
            --event-head-sha "$HEAD_SHA" \
            --policy-sha "$POLICY_SHA"
