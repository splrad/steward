name: SPLRAD Steward / Update Dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: 11 1 * * *
permissions:
  contents: read
  actions: read
jobs:
  targets:
    if: github.repository == 'splrad/steward' && github.repository_id == '1296724484' && github.ref == 'refs/heads/main' && vars.STEWARD_UPDATES_APPLY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: steward-automation
      deployment: false
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        env:
          MISE_SAFE: "1"
          MISE_NODE_COMPILE: "false"
        with:
          version: 2026.10.24
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - id: targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: node scripts/dependency-targets.mjs
      - name: update-targets-empty
        if: steps.targets.outputs.has_targets == 'false'
        run: echo 'No dependency update targets'
      - name: update-targets-found
        if: steps.targets.outputs.has_targets == 'true'
        run: echo 'Dependency update targets found'
      - name: Report unavailable update targets
        if: steps.targets.outputs.failed != '0'
        run: exit 1

  update:
    needs: targets
    if: '!cancelled() && needs.targets.outputs.has_targets == ''true'''
    name: update (${{ strategy.job-index }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: steward-automation
      deployment: false
    concurrency:
      group: dependency-updates
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        env:
          MISE_SAFE: "1"
          MISE_NODE_COMPILE: "false"
        with:
          version: 2026.10.24
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - id: renovate-tools
        name: Bind locked uv for native sidecar resolution
        run: |
          uv=$(mise which uv)
          test -x "$uv"
          mise exec --locked -- uv --version
          printf 'uv=%s\n' "$uv" >> "$GITHUB_OUTPUT"
      - id: before
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
          UPDATE_SLOT: ${{ matrix.slot }}
        run: node scripts/dependency-targets.mjs
      - id: target-token
        if: steps.before.outputs.enabled == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: "Iv23liuSr0qd4WLJdZhH"
          private-key: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          owner: splrad
          repositories: ${{ steps.before.outputs.repository }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read
          permission-workflows: write
          permission-checks: read
          permission-metadata: read
          permission-vulnerability-alerts: read
      - id: write-check
        if: steps.target-token.outputs.token != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
          UPDATE_SLOT: ${{ matrix.slot }}
          UPDATE_WRITE_TOKEN: ${{ steps.target-token.outputs.token }}
        run: node scripts/dependency-targets.mjs
      - id: renovate
        if: steps.write-check.outputs.enabled == 'true'
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          configurationFile: config/renovate/global.cjs
          token: ${{ steps.target-token.outputs.token }}
          renovate-image: ghcr.io/renovatebot/renovate:44.198.2@sha256:4132c8c1b0051ade1429c2e5f439569b361b4527216a1c184ff4ba58a2d1fd7e
          mount-docker-socket: false
          docker-volumes: /tmp:/tmp;${{ steps.renovate-tools.outputs.uv }}:/usr/local/bin/uv:ro
          env-regex: ^(?:RENOVATE_REPOSITORIES|MISE_SAFE|LOG_LEVEL|LOG_FILE|LOG_FILE_LEVEL)$
        env:
          RENOVATE_REPOSITORIES: ${{ steps.write-check.outputs.full_name }}
          MISE_SAFE: "1"
          LOG_LEVEL: debug
          LOG_FILE: /tmp/steward-renovate.jsonl
          LOG_FILE_LEVEL: debug
      - if: always() && steps.write-check.outputs.enabled == 'true'
        run: node scripts/verify-renovate-log.mjs /tmp/steward-renovate.jsonl
