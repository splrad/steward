name: SPLRAD Steward / PR Classification
on:
  workflow_dispatch:
    inputs:
      deliveryId:
        required: true
        type: string
      repositoryId:
        required: true
        type: string
      pullRequestNumber:
        required: false
        type: string
      eventHeadSha:
        required: false
        type: string
      aiClassification:
        required: false
        type: string
      scanAll:
        required: false
        type: boolean
        default: false
      policySha:
        required: true
        type: string
permissions: {}
concurrency:
  group: workflow-policy:${{ github.workflow_ref }}:steward-pr-classification-${{ inputs.repositoryId }}-${{ inputs.pullRequestNumber }}
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: steward-automation
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.policySha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 分类并发布门禁
        env:
          APP_ID: "4243096"
          INSTALLATION_ID: "145952003"
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          AI_CLASSIFICATION: ${{ inputs.aiClassification }}
          TRIGGER_ACTOR_ID: ${{ github.actor_id }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_RUN_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          DELIVERY_ID: ${{ inputs.deliveryId }}
          REPOSITORY_ID: ${{ inputs.repositoryId }}
          PULL_REQUEST_NUMBER: ${{ inputs.pullRequestNumber }}
          EVENT_HEAD_SHA: ${{ inputs.eventHeadSha }}
          SCAN_ALL: ${{ inputs.scanAll }}
          POLICY_SHA: ${{ inputs.policySha }}
        run: |
          set -euo pipefail
          args=(--scan-all "$SCAN_ALL")
          if [[ "$SCAN_ALL" != "true" ]]; then
            args+=(--pull-request-number "$PULL_REQUEST_NUMBER" --event-head-sha "$EVENT_HEAD_SHA")
          fi
          node packages/runner/dist/index.js pr-classification --delivery-id "$DELIVERY_ID" --repository-id "$REPOSITORY_ID" "${args[@]}" --policy-sha "$POLICY_SHA"
