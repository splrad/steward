name: SPLRAD Steward / PR Classification

on:
  workflow_dispatch:
    inputs:
      deliveryId: { required: true, type: string }
      repositoryId: { required: true, type: string }
      pullRequestNumber: { required: false, type: string }
      eventHeadSha: { required: false, type: string }
      aiClassification: { required: false, type: string }
      scanAll: { required: false, type: boolean, default: false }
      policySha: { required: true, type: string }

permissions: {}
concurrency:
  group: steward-pr-classification-${{ inputs.repositoryId }}-${{ inputs.pullRequestNumber }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: steward-automation
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: "${{ inputs.policySha }}", persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci --ignore-scripts
      - name: 分类并发布门禁
        env:
          APP_ID: "4243096"
          INSTALLATION_ID: "145952003"
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          AI_CLASSIFICATION: ${{ inputs.aiClassification }}
        run: node packages/runner/dist/index.js pr-classification --delivery-id "${{ inputs.deliveryId }}" --repository-id "${{ inputs.repositoryId }}" ${{ inputs.scanAll && '--scan-all true' || format('--pull-request-number "{0}" --event-head-sha "{1}" --scan-all false', inputs.pullRequestNumber, inputs.eventHeadSha) }} --policy-sha "${{ inputs.policySha }}"
