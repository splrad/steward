name: SPLRAD Steward / Sync Review Instructions
on:
  workflow_dispatch:
    inputs:
      repositoryId:
        required: false
        type: string
  workflow_run:
    workflows:
      - SPLRAD Steward / Deploy Runtime
    types:
      - completed
permissions:
  contents: read
  actions: read
concurrency:
  group: workflow-policy:${{ github.workflow_ref }}:steward-review-instructions-sync
  cancel-in-progress: false
jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == github.event.repository.default_branch && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      policy_sha: ${{ steps.policy.outputs.policy_sha }}
      matrix: ${{ steps.targets.outputs.matrix }}
    environment:
      name: steward-automation
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: policy-bootstrap
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: policy-bootstrap/.node-version
      - id: policy
        name: 解析已部署规则提交
        run: node policy-bootstrap/packages/runner/dist/index.js trusted-policy-source
        env:
          POLICY_SOURCE_READ_TOKEN: ${{ github.token }}
          POLICY_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.policy.outputs.policy_sha }}
          persist-credentials: false
          path: policy-live
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: policy-live/.node-version
      - run: npm ci --ignore-scripts
        working-directory: policy-live
      - name: 解析同步仓库与模式
        id: targets
        shell: bash
        env:
          APP_ID: "4243096"
          INSTALLATION_ID: "145952003"
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          REPOSITORY_ID: ${{ inputs.repositoryId }}
          POLICY_SHA: ${{ steps.policy.outputs.policy_sha }}
          SYNC_TRIGGER: ${{ github.actor_id == '301115370' && 'app-redrive' || github.event_name }}
          TRIGGER_ACTOR_ID: ${{ github.actor_id }}
          TRIGGER_ACTOR_LOGIN: ${{ github.actor }}
        run: |
          repository_arguments=()
          if [[ -n "$REPOSITORY_ID" ]]; then
            repository_arguments+=(--repository-id "$REPOSITORY_ID")
          fi
          node packages/runner/dist/index.js review-sync-targets "${repository_arguments[@]}" --policy-sha "$POLICY_SHA"
        working-directory: policy-live
  synchronize:
    needs: resolve
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    concurrency:
      group: workflow-resource:1296724484:pr-body
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: steward-automation
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: policy-bootstrap
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: policy-bootstrap/.node-version
      - id: policy
        name: 解析已部署规则提交
        run: node policy-bootstrap/packages/runner/dist/index.js trusted-policy-source
        env:
          POLICY_SOURCE_READ_TOKEN: ${{ github.token }}
          POLICY_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          POLICY_SOURCE_EXPECTED_SHA: ${{ needs.resolve.outputs.policy_sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.policy.outputs.policy_sha }}
          persist-credentials: false
          path: policy-live
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: policy-live/.node-version
      - run: npm ci --ignore-scripts
        working-directory: policy-live
      - name: 同步代码审查说明
        shell: bash
        env:
          APP_ID: "4243096"
          INSTALLATION_ID: "145952003"
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          RUNTIME_URL: https://splrad-steward-runtime.alearner-5ef.workers.dev
          REPOSITORY_ID: ${{ matrix.repositoryId }}
          POLICY_SHA: ${{ steps.policy.outputs.policy_sha }}
          SYNC_TRIGGER: ${{ github.actor_id == '301115370' && 'app-redrive' || github.event_name }}
          TRIGGER_ACTOR_ID: ${{ github.actor_id }}
          TRIGGER_ACTOR_LOGIN: ${{ github.actor }}
        run: |
          repository_arguments=()
          if [[ -n "$REPOSITORY_ID" ]]; then
            repository_arguments+=(--repository-id "$REPOSITORY_ID")
          fi
          node packages/runner/dist/index.js sync-review-instructions "${repository_arguments[@]}" --policy-sha "$POLICY_SHA"
        working-directory: policy-live
