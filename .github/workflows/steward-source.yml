name: Steward source tests
run-name: Product CI ${{ github.event.pull_request.number }} ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  plan:
    if: github.event_name == 'pull_request' || (github.ref_name == github.event.repository.default_branch || github.ref_name == 'perf/governance-windows-checks')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.select.outputs.profile }}
      runners: ${{ steps.select.outputs.runners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: ${{ github.event.pull_request.base.sha || 'c9912de6e7b7eb18693dd3fdd47b717e312896ba' }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || '70433e5a9e0512785c3b8c66db22777546aa1ab6' }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event_name == 'push'
        with:
          ref: 8da838a02a48916cc8da597c60e6786762ab66ca
          path: replay-policy
          persist-credentials: false
      - id: select
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'c9912de6e7b7eb18693dd3fdd47b717e312896ba' }}
          HEAD: ${{ github.event.pull_request.head.sha || '70433e5a9e0512785c3b8c66db22777546aa1ab6' }}
        run: |
          profile=full
          if [[ -n "$BASE" && -f policy/scripts/steward-ci-profile.py ]]; then
            profile=$(python policy/scripts/steward-ci-profile.py "$BASE" "$HEAD")
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$(git -C target rev-parse HEAD)" = "$HEAD"
            test "$(git -C policy rev-parse HEAD)" = "$BASE"
            profile=$(GITHUB_EVENT_NAME=pull_request python replay-policy/scripts/steward-ci-profile.py "$BASE" "$HEAD")
            test "$profile" = governance
          fi
          case "$profile" in
            full|governance|title|docs|policy) runners='["ubuntu-24.04"]' ;;
            tool) runners='["ubuntu-24.04","windows-2025"]' ;;
            *) exit 1 ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"
          echo "Selected Steward profile: $profile"
  candidate:
    needs: plan
    if: needs.plan.outputs.profile != 'full' && needs.plan.outputs.profile != 'governance'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: ${{ github.event.pull_request.base.sha || 'c9912de6e7b7eb18693dd3fdd47b717e312896ba' }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || '70433e5a9e0512785c3b8c66db22777546aa1ab6' }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Install trusted policy test dependencies
        if: needs.plan.outputs.profile == 'policy'
        working-directory: policy
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify candidate against the trusted base contract
        shell: bash
        env:
          PROFILE: ${{ needs.plan.outputs.profile }}
          BASE: ${{ github.event.pull_request.base.sha || 'c9912de6e7b7eb18693dd3fdd47b717e312896ba' }}
          HEAD: ${{ github.event.pull_request.head.sha || '70433e5a9e0512785c3b8c66db22777546aa1ab6' }}
        run: python policy/scripts/steward-ci-candidate.py "$PROFILE" "$BASE" "$HEAD"
  test:
    needs: plan
    if: needs.plan.outputs.profile == 'full' || needs.plan.outputs.profile == 'governance'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: ${{ github.event.pull_request.base.sha || 'c9912de6e7b7eb18693dd3fdd47b717e312896ba' }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || '70433e5a9e0512785c3b8c66db22777546aa1ab6' }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
          MISE_NODE_COMPILE: 'false'
        run: mise bin-paths | tac >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Verify changed candidate lock assets on this platform
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'c9912de6e7b7eb18693dd3fdd47b717e312896ba' }}
          HEAD: ${{ github.event.pull_request.head.sha || '70433e5a9e0512785c3b8c66db22777546aa1ab6' }}
        run: |
          if [[ -f policy/scripts/steward-ci-candidate.py ]]; then
            python policy/scripts/steward-ci-candidate.py full-lock "$BASE" "$HEAD"
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: target
      - name: Prepare isolated Windows rejection case for this draft
        if: github.event_name == 'pull_request' && runner.os == 'Windows'
        shell: bash
        working-directory: target
        run: |
          echo "it('rejects the deliberate Windows validation fixture', () => { throw Error('WINDOWS_GATE_FIXTURE'); });" >> packages/runner/test/governance-promotion.test.ts
      - name: Windows governance promotion checks
        if: runner.os == 'Windows' && (needs.plan.outputs.profile == 'governance' || github.event_name == 'pull_request')
        working-directory: target
        shell: bash
        env:
          STEWARD_TEST_TOOLCHAIN_ROOT: ${{ github.workspace }}/policy
        run: |
          npm run test:controller-source
          npm exec --offline -- vitest run packages/runner/test/{governance-promotion,build-environment,git-snapshot}.test.ts
          uv run --project tools/template --frozen python -m unittest discover -s tools/template -p test_promotion.py
      - name: Node tests and configuration
        if: runner.os != 'Windows' || needs.plan.outputs.profile == 'full'
        env:
          STEWARD_TEST_TOOLCHAIN_ROOT: ${{ github.workspace }}/policy
        working-directory: target
        shell: bash
        run: |
          python scripts/test/steward_ci_lock_test.py
          npm test
          npm run typecheck
          npm run verify:config -- --toolchain-root "$GITHUB_WORKSPACE/policy"
          npm run verify:dist
      - name: Verify production Worker source
        if: runner.os != 'Windows' || needs.plan.outputs.profile == 'full'
        working-directory: target/workers/steward
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Quality language tests
        if: runner.os == 'Linux'
        working-directory: target
        shell: bash
        run: |
          npm ci --prefix tools/quality-language --ignore-scripts --no-audit --no-fund
          npm test --prefix tools/quality-language
          npm run typecheck --prefix tools/quality-language
  result:
    needs: [plan, candidate, test]
    if: always() && (github.event_name == 'pull_request' || (github.ref_name == github.event.repository.default_branch || github.ref_name == 'perf/governance-windows-checks'))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful execution of the selected suite
        shell: bash
        env:
          PROFILE: ${{ needs.plan.outputs.profile }}
          PLAN: ${{ needs.plan.result }}
          FULL: ${{ needs.test.result }}
          CANDIDATE: ${{ needs.candidate.result }}
        run: |
          case "$PLAN/$PROFILE/$FULL/$CANDIDATE" in
            success/full/success/skipped|success/governance/success/skipped|success/title/skipped/success|success/docs/skipped/success|success/policy/skipped/success|success/tool/skipped/success) exit 0 ;;
            *) exit 1 ;;
          esac
