name: Steward source tests
run-name: Product CI ${{ github.event.pull_request.number }} ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  plan:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.select.outputs.profile }}
      runners: ${{ steps.select.outputs.runners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - id: select
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          profile=full
          if [[ -n "$BASE" && -f policy/scripts/steward-ci-profile.py ]]; then
            profile=$(python policy/scripts/steward-ci-profile.py "$BASE" "$HEAD")
          fi
          case "$profile" in
            full|governance|title|docs|policy) runners='["ubuntu-24.04"]' ;;
            tool) runners='["ubuntu-24.04","windows-2025"]' ;;
            *) exit 1 ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"
          echo "Selected Steward profile: $profile"
  candidate:
    needs: plan
    if: needs.plan.outputs.profile != 'full' && needs.plan.outputs.profile != 'governance'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Install trusted policy test dependencies
        if: needs.plan.outputs.profile == 'policy'
        working-directory: policy
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify candidate against the trusted base contract
        shell: bash
        env:
          GH_TOKEN: ${{ (needs.plan.outputs.profile == 'tool' || needs.plan.outputs.profile == 'docs') && github.token || '' }}
          PROFILE: ${{ needs.plan.outputs.profile }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python policy/scripts/steward-ci-candidate.py "$PROFILE" "$BASE" "$HEAD"
  test:
    needs: plan
    if: needs.plan.outputs.profile == 'full' || needs.plan.outputs.profile == 'governance'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.11.14
          working_directory: policy
          install: false
          cache: false
          env: false
          persist_github_token: false
      - name: Install the Python build selected by the trusted policy
        working-directory: policy
        shell: python
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import tomllib

          # SAFE mode resolves project URLs independently. Two PBS releases can
          # contain different builds of the same CPython patch version.
          record, = tomllib.loads(Path('mise.lock').read_text(encoding='utf-8'))['tools']['python']
          version = record['version']
          platform, target = {
              'Linux': ('linux-x64', 'unknown-linux-gnu'),
              'Windows': ('windows-x64', 'pc-windows-msvc'),
          }[os.environ['RUNNER_OS']]
          asset = record['platforms.' + platform]
          supplier = 'https://github.com/astral-sh/python-build-standalone/releases/download/'
          filename = r'/cpython-' + re.escape(version) + r'\+\1-x86_64-' + target + r'-install_only_stripped\.tar\.gz'
          if not (record['backend'] == 'core:python' and re.fullmatch(r'\d+\.\d+\.\d+', version)
                  and re.fullmatch(re.escape(supplier) + r'(\d{8})' + filename, asset['url'])
                  and re.fullmatch(r'sha256:[0-9a-f]{64}', asset['checksum'])
                  and asset['provenance'] == 'github-attestations'):
              raise ValueError('Unsupported trusted CPython asset')
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as temp:
              root = Path(temp)
              config = root / 'config.toml'
              config.write_text('[tools]\npython = ' + json.dumps(version) + '\n', encoding='utf-8')
              lock = ['[[tools.python]]', 'version = ' + json.dumps(version), 'backend = "core:python"',
                      'specifiers = [' + json.dumps(version) + ']', '[tools.python."platforms.' + platform + '"]']
              lock.extend(key + ' = ' + json.dumps(asset[key]) for key in ('url', 'checksum', 'provenance'))
              (root / 'mise.lock').write_text('\n'.join(lock) + '\n', encoding='utf-8')
              isolated = dict(os.environ, MISE_GLOBAL_CONFIG_FILE=str(config), MISE_CONFIG_DIR=temp,
                              MISE_ENABLE_TOOLS='python', MISE_LOCKED_VERIFY_PROVENANCE='1',
                              MISE_PYTHON_GITHUB_ATTESTATIONS='1')
              subprocess.run(['mise', 'install', '--locked'], cwd=temp, env=isolated, check=True)
          # All other tools and the subsequent tests use the original policy checkout.
          subprocess.run(['mise', 'install', '--locked'], check=True)
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
          MISE_NODE_COMPILE: 'false'
        run: mise bin-paths | tac >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Verify changed candidate lock assets on this platform
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -f policy/scripts/steward-ci-candidate.py ]]; then
            python policy/scripts/steward-ci-candidate.py full-lock "$BASE" "$HEAD"
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: target
      - name: Windows governance promotion checks
        id: controller-tests
        if: runner.os == 'Windows' && needs.plan.outputs.profile == 'governance'
        working-directory: target
        shell: bash
        env:
          STEWARD_TEST_TOOLCHAIN_ROOT: ${{ github.workspace }}/policy
          STEWARD_NODE_TEST_REPORTS: ${{ runner.temp }}/steward-node-junit
        run: |
          npm run test:source-controller
          suites=(packages/runner/test/{governance-promotion,build-environment,git-snapshot}.test.ts)
          for suite in "${suites[@]}"; do test -f "$suite"; done
          npm exec --offline -- vitest run "${suites[@]}"
      - name: Node tests and configuration
        id: full-tests
        if: runner.os != 'Windows' || needs.plan.outputs.profile == 'full'
        env:
          STEWARD_TEST_TOOLCHAIN_ROOT: ${{ github.workspace }}/policy
          STEWARD_NODE_TEST_REPORTS: ${{ runner.temp }}/steward-node-junit
        working-directory: target
        shell: bash
        run: |
          python scripts/test/steward_ci_lock_test.py
          npm test
          npm run typecheck
          npm run verify:config -- --toolchain-root "$GITHUB_WORKSPACE/policy"
          npm run verify:dist
      - name: Test template promotion with native Git
        working-directory: target
        run: uv run --project tools/template --frozen python tools/template/test_promotion.py
      - name: Verify production Worker source
        if: runner.os != 'Windows' || needs.plan.outputs.profile == 'full'
        working-directory: target/workers/steward
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Quality language tests
        id: quality-tests
        if: runner.os == 'Linux'
        working-directory: target
        shell: bash
        env:
          STEWARD_NODE_TEST_REPORTS: ${{ runner.temp }}/steward-node-junit
        run: |
          npm ci --prefix tools/quality-language --ignore-scripts --no-audit --no-fund
          npm run test:quality-language
          npm run typecheck --prefix tools/quality-language
      - name: Summarize Node suites
        if: always() && (steps.full-tests.outcome != 'skipped' || steps.controller-tests.outcome != 'skipped' || steps.quality-tests.outcome != 'skipped')
        working-directory: target
        env:
          STEWARD_NODE_TEST_REPORTS: ${{ runner.temp }}/steward-node-junit
          FULL: ${{ steps.full-tests.outcome }}
          CONTROLLER: ${{ steps.controller-tests.outcome }}
          QUALITY: ${{ steps.quality-tests.outcome }}
        run: python scripts/steward-test-summary.py
  result:
    needs: [plan, candidate, test]
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful execution of the selected suite
        shell: bash
        env:
          PROFILE: ${{ needs.plan.outputs.profile }}
          PLAN: ${{ needs.plan.result }}
          FULL: ${{ needs.test.result }}
          CANDIDATE: ${{ needs.candidate.result }}
        run: |
          case "$PLAN/$PROFILE/$FULL/$CANDIDATE" in
            success/full/success/skipped|success/governance/success/skipped|success/title/skipped/success|success/docs/skipped/success|success/policy/skipped/success|success/tool/skipped/success) exit 0 ;;
            *) exit 1 ;;
          esac
