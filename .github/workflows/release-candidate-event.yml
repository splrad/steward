name: SPLRAD candidate event
run-name: Candidate event ${{ inputs.request_key }}
on:
  workflow_dispatch:
    inputs:
      event_json:
        type: string
        required: true
      request_key:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      policy_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: steward-release-coordinator
  cancel-in-progress: false
  queue: max
jobs:
  event:
    env:
      MISE_ENABLE_TOOLS: node,npm
    if: github.actor_id == '301115370' && github.repository_id == '1296724484' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.policy_sha == github.sha && github.workflow_sha == github.sha
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment:
      name: steward-release
      deployment: false
    permissions:
      contents: read
      actions: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.11.14
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install locked controller dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authorize the official candidate event
        id: product
        env:
          STEWARD_CENTRAL_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
          STEWARD_OFFICIAL_CANDIDATES_ENABLED: ${{ vars.STEWARD_OFFICIAL_CANDIDATES_ENABLED }}
          BOUNDED_MODE: normal
          BOUNDED_POLICY_SHA: ${{ inputs.policy_sha }}
          BOUNDED_EVENT_JSON: ${{ inputs.event_json }}
          BOUNDED_SOURCE_SHA: ${{ inputs.source_sha }}
          BOUNDED_REQUEST_KEY: ${{ inputs.request_key }}
        run: node scripts/official-candidate-event.mjs identify
      - name: Compute or restore the official candidate
        if: steps.product.outputs.route == 'official'
        id: compute
        env:
          STEWARD_CENTRAL_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
        run: node scripts/official-candidate-event.mjs prepare
      - name: Install and verify the locked Copilot runtime
        if: steps.compute.outputs.mode == 'draft'
        run: |
          npm ci --prefix tools/quality-language --ignore-scripts --no-audit --no-fund
          npm run verify:runtime --prefix tools/quality-language
      - name: Draft the release notes with Copilot
        if: steps.compute.outputs.mode == 'draft'
        env:
          STEWARD_COPILOT_TOKEN: ${{ github.token }}
        run: node scripts/official-candidate-event.mjs generate
      - name: Record the draft and check body, version and source
        id: check
        if: steps.compute.outputs.mode == 'draft' || steps.compute.outputs.mode == 'write'
        env:
          STEWARD_CENTRAL_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
        run: node scripts/official-candidate-event.mjs check
      - name: Issue the product candidate token
        id: candidate-token
        if: steps.check.outputs.mode == 'write'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: Iv23liuSr0qd4WLJdZhH
          private-key: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          owner: splrad
          repositories: ${{ steps.product.outputs.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Create or refresh the candidate with validated inputs
        if: steps.check.outputs.mode == 'write'
        env:
          STEWARD_CENTRAL_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_CANDIDATE_TOKEN: ${{ steps.candidate-token.outputs.token }}
        run: node scripts/official-candidate-event.mjs write
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-event-${{ inputs.request_key }}-${{ github.run_attempt }}
          path: result.json
          if-no-files-found: error
          retention-days: 90
