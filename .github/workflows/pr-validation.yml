name: SPLRAD Steward / PR Validation
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: steward-pr-validation-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      policy: ${{ steps.policy.outputs.sha }}
      profile: ${{ steps.profile.outputs.name }}
    steps:
      - name: 解析中央规则提交
        id: policy
        shell: bash
        run: |
          value="${GITHUB_WORKFLOW_SHA}"
          [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "工作流来源不是完整提交编号" >&2; exit 1; }
          echo "sha=${value,,}" >> "$GITHUB_OUTPUT"
      - name: 检出合并候选
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: 检出中央规则
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: splrad/steward
          ref: ${{ steps.policy.outputs.sha }}
          path: steward-policy
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        env:
          MISE_SAFE: "1"
          MISE_NODE_COMPILE: "false"
        with:
          version: 2026.10.18
          install_args: --locked
          working_directory: steward-policy
          cache: false
          env: false
          persist_github_token: false
      - run: npm ci --ignore-scripts
        working-directory: steward-policy
      - name: 选择验证配置
        id: profile
        shell: bash
        run: node steward-policy/packages/runner/dist/index.js validation-profile --repository-id "${{ github.repository_id }}" --private "${{ github.event.repository.private }}"
      - name: validation-policy:${{ steps.policy.outputs.sha }}
        env:
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VALIDATION_BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPOSITORY_ID: ${{ github.repository_id }}
          VALIDATION_PROFILE: ${{ steps.profile.outputs.name }}
        run: node steward-policy/packages/runner/dist/index.js validate --workspace target --repository-id "$REPOSITORY_ID" --profile "$VALIDATION_PROFILE"
