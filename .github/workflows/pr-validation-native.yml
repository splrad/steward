name: SPLRAD Steward / Native Validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
env:
  PRIVATE_GOVERNANCE_REPOSITORY_ID: ${{ vars.STEWARD_PRIVATE_GOVERNANCE_REPOSITORY_ID }}
concurrency:
  group: native-validation-${{ github.repository_id }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: Validation scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source: ${{ steps.identity.outputs.dependencyMode == 'private-governance' && 'false' || steps.scope.outputs.source }}
      dependency: ${{ startsWith(steps.identity.outputs.dependencyMode, 'private-') && 'true' || steps.scope.outputs.dependency }}
      dependency-mode: ${{ steps.identity.outputs.dependencyMode }}
      docs: ${{ steps.scope.outputs.docs }}
      governance: ${{ steps.scope.outputs.governance }}
      mode: ${{ steps.identity.outputs.mode }}
      base: ${{ steps.identity.outputs.base }}
      head: ${{ steps.identity.outputs.head }}
    env:
      VALIDATION_WORKSPACE: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
          MISE_NODE_COMPILE: 'false'
        run: mise bin-paths | tac >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Record platform workflow provenance
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          printf 'WORKFLOW_REPOSITORY=%s\nWORKFLOW_SHA=%s\nWORKFLOW_PATH=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_PATH" >> "$GITHUB_ENV"
      - id: identity
        run: node policy/scripts/validation-input.mjs
        env:
          VALIDATION_EVIDENCE: validation-scope.json
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: scope
        with:
          token: ''
          working-directory: target
          base: ${{ steps.identity.outputs.base }}
          ref: ${{ steps.identity.outputs.head }}
          list-files: json
          filters: |
            source: &source
              - '!**/*.{md,mdx,html,htm,png,jpg,jpeg,gif,svg,webp,ico}'
              - '{.github,templates,schema,config,scripts,tools}/**'
              - '**/{AGENTS.md,AGENTS.override.md,CONTRIBUTING.md,copilot-instructions.md,*.instructions.md}'
            governance: *source
            dependency:
              - '.mise/**'
              - '**/{package.json,package-lock.json,npm-shrinkwrap.json,mise.toml,mise.lock,pyproject.toml,requirements*.txt,*.lock,*.lock.json,global.json,Directory.Build.props,Directory.Packages.props,*.csproj,*.sln,*.slnx,go.mod,go.sum,Cargo.toml,pom.xml,CMakeLists.txt}'
              - '{.github/workflows,templates,schema,config,tools}/**'
              - '**/{AGENTS.md,AGENTS.override.md,CONTRIBUTING.md,copilot-instructions.md,*.instructions.md}'
            docs:
              - '**'
      - name: Save native filter outputs
        env:
          FILTER_OUTPUTS: ${{ toJSON(steps.scope.outputs) }}
        run: node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("validation-filter.json", process.env.FILTER_OUTPUTS + "\n");'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: validation-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation-scope.json
            validation-filter.json
          if-no-files-found: error
  source-linux:
    name: Source linux
    needs: scope
    if: needs.scope.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VALIDATION_WORKSPACE: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
          MISE_NODE_COMPILE: 'false'
        run: mise bin-paths | tac >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Record platform workflow provenance
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          printf 'WORKFLOW_REPOSITORY=%s\nWORKFLOW_SHA=%s\nWORKFLOW_PATH=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_PATH" >> "$GITHUB_ENV"
      - name: Verify source identity
        run: node policy/scripts/validation-input.mjs
      - name: Node tests and configuration
        env:
          STEWARD_TEST_TOOLCHAIN_ROOT: ${{ github.workspace }}/policy
        if: needs.scope.outputs.source == 'true' && needs.scope.outputs.mode == 'node'
        working-directory: target
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
          npm run verify:config -- --toolchain-root "$GITHUB_WORKSPACE/policy"
          npm run verify:dist
          if [ "$GITHUB_REPOSITORY_ID" = "1296724484" ]; then
            npm ci --prefix tools/quality-language --ignore-scripts --no-audit --no-fund
            npm test --prefix tools/quality-language
            npm run typecheck --prefix tools/quality-language
          fi
      - name: Python locked build and tests
        if: needs.scope.outputs.mode == 'python'
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          POLICY_PYTHON="$(cd "$GITHUB_WORKSPACE/policy" && python -I -c 'import sys; print(sys.executable)')"
          VENV="$RUNNER_TEMP/python-validation"
          OUT="$RUNNER_TEMP/python-validation-dist"
          uv venv --no-config --no-python-downloads --python "$POLICY_PYTHON" "$VENV"
          if [ "$RUNNER_OS" = Windows ]; then BUILD_PYTHON="$VENV/Scripts/python.exe"; else BUILD_PYTHON="$VENV/bin/python"; fi
          uv pip sync --no-config --python "$BUILD_PYTHON" --default-index https://pypi.org/simple --require-hashes --only-binary :all: requirements-build.txt
          "$BUILD_PYTHON" -I -m compileall -q .
          uv build --no-config --offline --no-sources --no-build-isolation --python "$BUILD_PYTHON" --out-dir "$OUT" .
          "$BUILD_PYTHON" -I -m twine check "$OUT"/*
          uv pip install --no-config --offline --python "$BUILD_PYTHON" --no-deps "$OUT"/*.whl
          if [ -d tests ]; then "$BUILD_PYTHON" -I -m unittest discover -s tests; fi
      - name: Applicability
        env:
          SELECTED: ${{ needs.scope.outputs.source }}
          MODE: ${{ needs.scope.outputs.mode }}
        shell: bash
        run: printf 'source selected=%s; build interface=%s (dotnet build runs on Windows)\n' "$SELECTED" "$MODE"
  source-windows:
    name: Source windows
    needs: scope
    if: needs.scope.outputs.source == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      VALIDATION_WORKSPACE: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
          MISE_NODE_COMPILE: 'false'
        run: mise bin-paths | tac >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Record platform workflow provenance
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          printf 'WORKFLOW_REPOSITORY=%s\nWORKFLOW_SHA=%s\nWORKFLOW_PATH=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_PATH" >> "$GITHUB_ENV"
      - name: Verify source identity
        run: node policy/scripts/validation-input.mjs
      - name: Node tests and configuration
        env:
          STEWARD_TEST_TOOLCHAIN_ROOT: ${{ github.workspace }}/policy
        if: needs.scope.outputs.source == 'true' && needs.scope.outputs.mode == 'node'
        working-directory: target
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
          npm run verify:config -- --toolchain-root "$GITHUB_WORKSPACE/policy"
          npm run verify:dist
      - name: Parse PowerShell and MSBuild inputs
        if: needs.scope.outputs.source == 'true' || needs.scope.outputs.governance == 'true'
        shell: pwsh
        run: ./policy/scripts/validation-files.ps1 -Workspace ./target
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        if: needs.scope.outputs.source == 'true' && needs.scope.outputs.mode == 'dotnet'
        with:
          global-json-file: target/global.json
      - name: Product build
        if: needs.scope.outputs.source == 'true' && needs.scope.outputs.mode == 'dotnet'
        working-directory: target
        shell: pwsh
        run: |
          dotnet restore CADFontAutoReplace.slnx --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build CADFontAutoReplace.slnx --no-restore -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Python locked build and tests
        if: needs.scope.outputs.mode == 'python'
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          POLICY_PYTHON="$(cd "$GITHUB_WORKSPACE/policy" && python -I -c 'import sys; print(sys.executable)')"
          VENV="$RUNNER_TEMP/python-validation"
          OUT="$RUNNER_TEMP/python-validation-dist"
          uv venv --no-config --no-python-downloads --python "$POLICY_PYTHON" "$VENV"
          if [ "$RUNNER_OS" = Windows ]; then BUILD_PYTHON="$VENV/Scripts/python.exe"; else BUILD_PYTHON="$VENV/bin/python"; fi
          uv pip sync --no-config --python "$BUILD_PYTHON" --default-index https://pypi.org/simple --require-hashes --only-binary :all: requirements-build.txt
          "$BUILD_PYTHON" -I -m compileall -q .
          uv build --no-config --offline --no-sources --no-build-isolation --python "$BUILD_PYTHON" --out-dir "$OUT" .
          "$BUILD_PYTHON" -I -m twine check "$OUT"/*
          uv pip install --no-config --offline --python "$BUILD_PYTHON" --no-deps "$OUT"/*.whl
          if [ -d tests ]; then "$BUILD_PYTHON" -I -m unittest discover -s tests; fi
      - name: Applicability
        env:
          SELECTED: ${{ needs.scope.outputs.source }}
          MODE: ${{ needs.scope.outputs.mode }}
        shell: bash
        run: printf 'source selected=%s; build interface=%s (dotnet build runs on Windows)\n' "$SELECTED" "$MODE"
  governance:
    name: Governance scans
    needs: scope
    if: needs.scope.outputs.governance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VALIDATION_WORKSPACE: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
          MISE_NODE_COMPILE: 'false'
        run: mise bin-paths | tac >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Record platform workflow provenance
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          printf 'WORKFLOW_REPOSITORY=%s\nWORKFLOW_SHA=%s\nWORKFLOW_PATH=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_PATH" >> "$GITHUB_ENV"
      - run: node policy/scripts/validation-governance.mjs
      - name: Verify action dependency lock with the trusted tool version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_REPO: ${{ github.repository }}
          GH_CONFIG_DIR: ${{ runner.temp }}/actions-lock-config
          GH_ACTIONS_LOCK_REPO_ROOT: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          ACTIONS_LOCK_VERSION="$(cat policy/config/actions-lock-version.txt)"
          [[ "$ACTIONS_LOCK_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh extension install github/gh-actions-lock --pin "$ACTIONS_LOCK_VERSION"
          cd target
          gh actions-lock --verify --no-interactive
  dependency:
    name: Dependency review
    needs: scope
    if: needs.scope.outputs.dependency == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VALIDATION_WORKSPACE: ${{ github.workspace }}/target
    steps:
      - name: Require a supported dependency review mode
        env:
          DEPENDENCY_MODE: ${{ needs.scope.outputs.dependency-mode }}
        run: |
          case "$DEPENDENCY_MODE" in
            native|private-administrator|private-governance|private-lifecycle) ;;
            *) echo 'Missing trusted dependency mode'; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: startsWith(needs.scope.outputs.dependency-mode, 'private-')
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: startsWith(needs.scope.outputs.dependency-mode, 'private-')
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        if: startsWith(needs.scope.outputs.dependency-mode, 'private-')
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        if: startsWith(needs.scope.outputs.dependency-mode, 'private-')
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
          MISE_NODE_COMPILE: 'false'
        run: mise bin-paths | tac >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: startsWith(needs.scope.outputs.dependency-mode, 'private-')
        working-directory: policy
      - name: Record platform workflow provenance
        if: startsWith(needs.scope.outputs.dependency-mode, 'private-')
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          printf 'WORKFLOW_REPOSITORY=%s\nWORKFLOW_SHA=%s\nWORKFLOW_PATH=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_PATH" >> "$GITHUB_ENV"
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: needs.scope.outputs.dependency-mode == 'native'
        with:
          base-ref: ${{ needs.scope.outputs.base }}
          head-ref: ${{ needs.scope.outputs.head }}
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          comment-summary-in-pr: never
          warn-only: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
      - name: Applicability
        if: needs.scope.outputs.dependency == 'false'
        run: echo 'dependency not-applicable; complete trusted diff contains no dependency inputs'
      - name: Scan private administrator dependencies
        if: startsWith(needs.scope.outputs.dependency-mode, 'private-')
        working-directory: policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_DEPENDENCY_EVIDENCE: ${{ github.workspace }}/private-dependency-evidence
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
        run: |
          set -euo pipefail
          PRIVATE_ZIZMOR="$(mise which zizmor)"
          PRIVATE_SYFT="$(mise which syft)"
          PRIVATE_PYTHON="$(mise which python)"
          export PRIVATE_ZIZMOR PRIVATE_SYFT PRIVATE_PYTHON
          node scripts/validation-private-dependencies.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && startsWith(needs.scope.outputs.dependency-mode, 'private-') }}
        with:
          name: private-dependency-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: private-dependency-evidence/
          if-no-files-found: error
          retention-days: 7
  docs:
    name: Documentation links
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VALIDATION_WORKSPACE: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
          MISE_NODE_COMPILE: 'false'
        run: mise bin-paths | tac >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Record platform workflow provenance
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          printf 'WORKFLOW_REPOSITORY=%s\nWORKFLOW_SHA=%s\nWORKFLOW_PATH=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_PATH" >> "$GITHUB_ENV"
      - name: Install native firewall
        if: needs.scope.outputs.docs == 'true'
        run: sudo apt-get update && sudo apt-get install --yes nftables
      - run: node policy/scripts/validation-docs.mjs
        env:
          DOC_LINK_NETWORK: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && needs.scope.outputs.docs == 'true' }}
        with:
          name: doc-link-${{ github.run_id }}-${{ github.run_attempt }}
          path: doc-link-evidence/
          if-no-files-found: warn
  summary:
    name: SPLRAD Validation
    needs: [scope, source-linux, source-windows, governance, dependency, docs]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
          MISE_NODE_COMPILE: 'false'
        run: mise bin-paths | tac >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Record platform workflow provenance
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          printf 'WORKFLOW_REPOSITORY=%s\nWORKFLOW_SHA=%s\nWORKFLOW_PATH=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_PATH" >> "$GITHUB_ENV"
      - run: node policy/scripts/validation-summary.mjs
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
