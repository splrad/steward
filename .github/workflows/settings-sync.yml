name: SPLRAD Steward / Settings Sync
on:
  push:
    branches: [main]
    paths:
      - 'safe-settings/**'
      - 'tools/settings-sync/**'
      - 'scripts/settings-sync.mjs'
      - 'scripts/release-record.mjs'
      - 'packages/runner/dist/**'
      - '.github/workflows/settings-sync.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: steward-settings-sync
  cancel-in-progress: false
jobs:
  settings-sync:
    if: github.repository == 'splrad/steward' && github.repository_id == '1296724484' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: steward-automation
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github-community-projects/safe-settings
          # renovate: datasource=github-tags depName=github-community-projects/safe-settings
          ref: a9a1f366ad6a738b55682d346d94f8d6c4893b09 # 3.0.0
          path: tools/upstream/safe-settings
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.18
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install locked libraries without credentials
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/upstream/safe-settings --ignore-scripts --no-audit --no-fund
      - name: Run upstream full sync with private reports
        env:
          APP_ID: ${{ vars.GOVERNANCE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          FULL_SYNC_NOP: ${{ vars.STEWARD_SETTINGS_APPLY == 'true' && 'false' || 'true' }}
          STEWARD_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: node scripts/settings-sync.mjs
