version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Bangkok
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /tools/quality-language
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directories: ["/", "/templates/release", "/templates/repository/.github/workflows"]
    exclude-paths: [".github/workflows/pr-title.yml", ".github/workflows/pr-labeler.yml"]
    ignore:
      - dependency-name: splrad/steward
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /tools/template
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    target-branch: maintenance/legacy-runtime-e990eda
    ignore:
      - dependency-name: npm
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: maintenance/legacy-runtime-e990eda
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
