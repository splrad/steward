# These sources also serve as the reference for validating existing callers.
_exclude:
  - /.github/repository-configuration.md
  - /.github/workflows/repository-configuration-trial.yml
  - /.github/workflows/repository-configuration.yml
product_repository:
  type: str
  default: ''
  help: GitHub owner/repository for repository-specific navigation
