name: Pages
run-name: Pages ${{ !vars.STEWARD_DOCS_SOURCE && 'build-only ' || '' }}${{ inputs.source_mode || vars.STEWARD_DOCS_SOURCE || 'default-branch' }} ${{ inputs.source_sha || github.sha }} ${{ inputs.input_digest || github.event.release.id || github.run_id }}
on:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_mode:
        type: choice
        options: [default-branch, release]
        required: true
      source_sha:
        type: string
        required: true
      release_id:
        type: string
        required: false
        default: ''
      input_digest:
        type: string
        required: true
permissions: {}
concurrency:
  group: steward-pages-${{ github.repository_id }}
  queue: max
  cancel-in-progress: false
env:
  STEWARD_CONTROLLER_SHA: c83f0e8ec52f87b2cbcb745496f0a76d69f558f6
  # The configuration PR writes the selected source and release unit to these fields.
  STEWARD_DOCS_SOURCE: ${{ vars.STEWARD_DOCS_SOURCE || 'default-branch' }}
  STEWARD_DOCS_UNIT: ${{ vars.STEWARD_DOCS_UNIT }}
  STEWARD_DOCS_APPROVED_SOURCE: ${{ vars.STEWARD_DOCS_SOURCE }}
  STEWARD_DOCS_APPROVED_UNIT: ${{ vars.STEWARD_DOCS_UNIT }}
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      public_source: ${{ steps.source.outputs.public_source || steps.authorization.outputs.matches }}
      source: ${{ steps.source.outputs.source }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      input_digest: ${{ steps.source.outputs.input_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: splrad/steward
          ref: c83f0e8ec52f87b2cbcb745496f0a76d69f558f6
          path: controller
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.11.14
          working_directory: controller
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install selector libraries
        run: npm ci --prefix controller --ignore-scripts --no-audit --no-fund
      - name: Check approved public source
        id: authorization
        shell: python
        env:
          APPROVED_SOURCE: ${{ vars.STEWARD_DOCS_SOURCE }}
          APPROVED_UNIT: ${{ vars.STEWARD_DOCS_UNIT }}
        run: |
          import os

          mode = os.environ["STEWARD_DOCS_SOURCE"]
          unit = os.environ.get("STEWARD_DOCS_UNIT", "")
          matches = mode in ("default-branch", "release") and mode == os.environ["APPROVED_SOURCE"]
          if mode == "release":
              matches = matches and bool(unit) and unit == os.environ["APPROVED_UNIT"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"matches={str(matches).lower()}", file=output)
      - name: Select current Pages source
        id: source
        env:
          STEWARD_PAGES_BUILD_ONLY: ${{ steps.authorization.outputs.matches != 'true' }}
          GH_TOKEN: ${{ github.token }}
        run: node controller/scripts/select-pages-source.mjs
  build:
    name: build/${{ needs.select.outputs.input_digest }}
    needs: select
    if: needs.select.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.source_sha }}
          persist-credentials: false
      # Adopt this step and its output from the product's reviewed site build.
      - name: Build site
        id: site
        shell: bash
        run: bash .github/scripts/build-site.sh
        env:
          DOCS_SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
      - name: Check site output
        id: output
        shell: python
        env:
          SITE_DIRECTORY: ${{ steps.site.outputs.directory }}
        run: |
          import os
          from pathlib import Path

          raw = os.environ["SITE_DIRECTORY"]
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          if not raw or Path(raw).is_absolute() or any(c in raw for c in "\r\n"):
              raise ValueError("Expected a repository-relative site output directory")
          directory = (workspace / raw).resolve(strict=True)
          if workspace not in directory.parents or not directory.is_dir():
              raise ValueError("Expected a directory inside the workspace")
          if any(c in str(directory) for c in "\r\n"):
              raise ValueError("Invalid output path")
          found = False
          def fail(error):
              raise error
          for parent, dirs, files in os.walk(directory, onerror=fail):
              for name in dirs + files:
                  if (Path(parent) / name).is_symlink():
                      raise ValueError("Site output contains a symbolic link")
              for name in files:
                  if not (Path(parent) / name).is_file():
                      raise ValueError("Expected regular site output files")
                  found = True
          if not found:
              raise ValueError("Site output is empty")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"directory={directory}", file=output)
      - name: Upload Pages artifact
        id: artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.select.outputs.input_digest }}
          path: ${{ steps.output.outputs.directory }}
          retention-days: 1
  deploy:
    # The deployment source variable is set only after public deployment is approved.
    if: needs.select.outputs.ready == 'true' && needs.select.outputs.public_source == 'true'
    name: deploy/${{ needs.select.outputs.input_digest }}
    needs: [select, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      attestations: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: splrad/steward
          ref: c83f0e8ec52f87b2cbcb745496f0a76d69f558f6
          path: controller
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.11.14
          working_directory: controller
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install deployment checks
        run: npm ci --prefix controller --ignore-scripts --no-audit --no-fund
      - name: Recheck source and native artifact
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_SOURCE: ${{ needs.select.outputs.source }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: node controller/scripts/pages-runtime.mjs check
      - name: Deploy Pages
        id: deployment
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ steps.guard.outputs.artifact_name }}
      - name: Read native deployment identity
        if: steps.guard.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_SOURCE: ${{ needs.select.outputs.source }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: node controller/scripts/pages-runtime.mjs record
      - name: Archive Pages evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-evidence.json
          if-no-files-found: warn
          retention-days: 30
